# 1. The name of your workflow automation
name: Run My Commands

# 2. Trigger: When should this run? (On code push or manual button click)
on:
  workflow_dispatch:

# 3. Execution Environment (The Server)
jobs:
  execute-commands:
    runs-on: ubuntu-latest

    # 4. The sequential steps containing your commands
    steps:
      # Step A: Download your repository's code onto the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Run a single-line command
      - name: Single Line Command
        run: echo "Starting the automation process..."

      # Step C: Run multiple terminal commands sequentially
      - name: Multi-line Script Execution
        run: |
          echo "Current directory:"
          pwd
          
          ls -la
